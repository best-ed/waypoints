name: CI

on:
  push:
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # npm ci, not npm install: the lockfile is the point, and the browsers are pinned to
      # exactly what it says.
      - name: Install
        run: npm ci

      # Runs before the browsers are installed. It needs no browser, it is fast, and a failure
      # here should not wait on a few hundred megabytes of download first.
      - name: Unit tests
        run: npm test

      # The browser build is keyed to the Playwright version in the lockfile, so the cache is
      # only reused while that version is unchanged.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # A cache hit restores the browsers but not the system libraries they link against.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # A push runs the subset that guards the core flows: boot, add, a photo round trip on
      # both engines, the detail view, filters restored from the url, a hostile import, an
      # offline boot, the theme before the first paint, and axe on the two states every other
      # one is reached through. About thirty seconds.
      - name: End to end tests (smoke)
        if: github.event_name == 'push'
        run: npm run test:e2e:smoke

      # The whole suite before anything reaches main. It is four minutes, which is worth
      # paying once per pull request and not once per commit.
      - name: End to end tests (full)
        if: github.event_name == 'pull_request'
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
