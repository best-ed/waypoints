<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>waypoints</title>
    <meta name="description" content="Pin memories on an interactive map." />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>

    <!--
      Leaflet.markercluster. Only the structural stylesheet is loaded: the plugin's second
      sheet, MarkerCluster.Default.css, skins the .marker-cluster classes its default
      iconCreateFunction emits, and ours emits none of them, so every rule in it would be
      dead. Both hashes were computed from the bytes jsDelivr actually serves.
      Deferred after leaflet.js, which keeps the order, since the plugin extends the global L.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
      integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>

    <link rel="stylesheet" href="src/css/tokens.css" />
    <link rel="stylesheet" href="src/css/base.css" />
    <link rel="stylesheet" href="src/css/layout.css" />
    <link rel="stylesheet" href="src/css/map.css" />
    <link rel="stylesheet" href="src/css/popup.css" />
    <link rel="stylesheet" href="src/css/sidebar.css" />
    <link rel="stylesheet" href="src/css/place-search.css" />
    <link rel="stylesheet" href="src/css/journey.css" />
    <link rel="stylesheet" href="src/css/sandbox.css" />
    <link rel="stylesheet" href="src/css/toast.css" />
    <link rel="stylesheet" href="src/css/dialog.css" />
    <link rel="stylesheet" href="src/css/lightbox.css" />
  </head>
  <body>
    <p id="sandbox-banner" class="sandbox-banner" hidden>
      Sandbox &mdash; this is throwaway data, kept apart from your real memories.
    </p>

    <header class="app-header">
      <button
        id="sidebar-toggle"
        class="button icon-button"
        type="button"
        aria-expanded="true"
        aria-controls="sidebar"
      >
        Hide list
      </button>

      <h1 class="app-title">waypoints</h1>

      <button id="add-memory" class="button" type="button" aria-pressed="false">
        Add memory
      </button>
    </header>

    <div class="app-body">
      <aside id="sidebar" class="sidebar" aria-labelledby="sidebar-heading">
        <div class="sidebar-header">
          <h2 id="sidebar-heading" class="sidebar-heading">Memories</h2>

          <div class="search">
            <label class="visually-hidden" for="memory-search">Search memories</label>
            <input
              id="memory-search"
              class="search-input"
              type="search"
              autocomplete="off"
              placeholder="Search memories"
            />
            <button id="memory-search-clear" class="search-clear" type="button" hidden>
              Clear
            </button>
          </div>

          <div id="tag-bar" class="tag-bar" hidden>
            <ul id="tag-list" class="tag-list" aria-label="Filter by tag"></ul>
            <button id="tag-toggle" class="tag-toggle" type="button" hidden></button>
          </div>

          <div id="date-range" class="date-range" hidden>
            <div class="date-field">
              <label class="date-label" for="filter-from">From</label>
              <input id="filter-from" class="date-input" type="date" />
            </div>
            <div class="date-field">
              <label class="date-label" for="filter-to">To</label>
              <input id="filter-to" class="date-input" type="date" />
            </div>
          </div>

          <div id="timeline" class="timeline" hidden>
            <ul id="timeline-bars" class="timeline-bars" aria-hidden="true"></ul>
            <div class="timeline-handles">
              <input
                id="timeline-start"
                class="timeline-handle"
                type="range"
                aria-label="Start date"
                aria-describedby="timeline-range"
              />
              <input
                id="timeline-end"
                class="timeline-handle"
                type="range"
                aria-label="End date"
                aria-describedby="timeline-range"
              />
            </div>

            <p id="timeline-range" class="visually-hidden" aria-live="polite"></p>
          </div>

          <p id="memory-count" class="sidebar-count"></p>

          <button id="filter-reset" class="filter-reset" type="button" hidden>
            Reset filters
          </button>

          <div class="journey">
            <button
              id="journey-toggle"
              class="button journey-toggle"
              type="button"
              aria-pressed="false"
              aria-describedby="journey-hint"
            >
              Journey
            </button>

            <p id="journey-hint" class="journey-hint" hidden>
              A journey needs at least two memories in view.
            </p>

            <p id="journey-summary" class="journey-summary" hidden></p>

            <div id="journey-controls" class="journey-controls" role="group" aria-label="Journey playback" hidden>
              <button id="journey-previous" class="button journey-step" type="button">Previous</button>
              <button id="journey-play" class="button journey-play" type="button" aria-label="Play journey">
                Play
              </button>
              <button id="journey-next" class="button journey-step" type="button">Next</button>

              <p id="journey-progress" class="journey-progress" aria-live="polite"></p>
            </div>
          </div>
        </div>

        <p id="memory-empty" class="sidebar-empty" tabindex="-1" hidden></p>

        <ul id="memory-list" class="memory-list"></ul>
      </aside>

      <main class="app-main">
        <div id="map" class="map"></div>
      </main>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>

    <dialog id="memory-dialog" class="dialog" aria-labelledby="memory-dialog-title">
      <form id="memory-form" class="form" novalidate>
        <h2 id="memory-dialog-title" class="dialog-title">New memory</h2>

        <p id="memory-form-error" class="form-error" role="alert" hidden></p>

        <p class="coordinates">
          <span class="coordinates-label">Pinned at</span>
          <span id="memory-coordinates" class="coordinates-value"></span>
        </p>

        <div class="field">
          <label class="field-label" for="memory-title">Title</label>
          <input id="memory-title" name="title" class="field-input" type="text" autocomplete="off" />
          <p id="memory-title-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label class="field-label" for="memory-date">Date</label>
          <input id="memory-date" name="date" class="field-input" type="date" />
          <p id="memory-date-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label class="field-label" for="memory-note">Note</label>
          <textarea id="memory-note" name="note" class="field-input field-textarea" rows="3"></textarea>
          <p id="memory-note-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label class="field-label" for="memory-place-name">Place name</label>
          <input id="memory-place-name" name="placeName" class="field-input" type="text" autocomplete="off" />
          <p id="memory-place-hint" class="field-hint" hidden>Finding place...</p>
          <p id="memory-place-name-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label class="field-label" for="memory-tags">Tags</label>
          <input id="memory-tags" name="tags" class="field-input" type="text" autocomplete="off" />
          <p id="memory-tags-hint" class="field-hint">Separate tags with commas</p>
          <p id="memory-tags-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <span class="field-label" id="memory-photos-label">Photos</span>
          <p id="memory-photos-count" class="field-hint"></p>

          <ul id="memory-photos" class="photo-grid" aria-labelledby="memory-photos-label"></ul>

          <div id="memory-photos-errors" class="field-error" hidden></div>

          <input
            id="memory-photo-input"
            class="photo-input"
            type="file"
            accept="image/*"
            multiple
          />
          <label class="button photo-add" for="memory-photo-input">Add photos</label>
        </div>

        <div class="dialog-actions">
          <button id="memory-cancel" class="button" type="button">Cancel</button>
          <button id="memory-save" class="button button-primary" type="submit">Save memory</button>
        </div>
      </form>
    </dialog>

    <dialog id="lightbox" class="lightbox" aria-label="Photo viewer">
      <img id="lightbox-image" class="lightbox-image" alt="" />

      <p id="lightbox-position" class="lightbox-position" aria-live="polite"></p>

      <div class="lightbox-controls">
        <button id="lightbox-previous" class="button" type="button">Previous</button>
        <button id="lightbox-next" class="button" type="button">Next</button>
        <button id="lightbox-close" class="button" type="button">Close</button>
      </div>
    </dialog>

    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
